name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBand-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=SafeBand $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.2" >> $GITHUB_OUTPUT
            echo "title=SafeBand v1.0.2 - Child Bio Data & Medical Profile" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🛡️ SafeBand (ChildGuard) Release - ${{ steps.release_info.outputs.tag }}

            ### 🚀 New Features & Enhancements:
            - **Child Bio Data & Medical Container in Emergency Alerts**:
              - Added a dedicated, prominent Child Bio Data container in the emergency alert sheet.
              - Displays child identity, blood group badge (e.g. `🩸 O+`), primary parent phone number with click-to-call button, secondary contact, known medical conditions, allergies, and emergency notes.
              - In-place **"Edit Child Bio & Medical Data"** dialog allows instant editing directly on the alert screen.
            - **Medical & Bio Details in SOS SMS Alerts**:
              - Emergency dispatch SMS now includes blood type, parent phone, medical conditions, allergies, and instructions alongside live GPS coordinates and device ID.
            - **Settings Bio Profile Management**:
              - Added complete Child Bio & Medical Profile management inside the Settings screen with instant local persistence.
            - **Parent Alert Continuous Sound Bug Fixed (v1.0.1)**:
              - Verified silence retention across continuous BLE packets, 7-second watchdog, and child cancellation broadcast.

            ---
            ### 📱 Download & Install:
            - Download **`app-debug.apk`** below directly to your Android device.
            - Open the APK and allow installation to update or install SafeBand.
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
