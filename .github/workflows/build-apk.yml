name: Build & Verify Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Generate Checksums & Inspect Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/SafeBand-Guardian-v3.3.0-release.apk || cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/SafeBand-Guardian-v3.3.0.apk
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeBand-Guardian-v3.3.0-Artifacts
          path: release-artifacts/*
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=SafeBand $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=v3.3.0" >> $GITHUB_OUTPUT
            echo "title=SafeBand Guardian v3.3.0 - Production Release" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🛡️ SafeBand Guardian Release - ${{ steps.release_info.outputs.tag }}

            ### 🚀 Production Features:
            - **Strict Child Lockdown & Master PIN Authorization**:
              - Unlocking requires configured 6-digit Master PIN or active non-expired one-time pairing code.
              - Rejects arbitrary numeric inputs; demo bypasses isolated to debug builds.
            - **Role-Based Access Control (RBAC)**:
              - Isolated Parent and Child experiences with strict permission boundaries (`AccessController`).
              - Child mode strictly prevents accessing parent settings, child profiles, or safe zone management.
            - **Parent-Authorized Child Device Provisioning**:
              - 15-minute TTL one-time cryptographic challenge with atomic claim enforcement.
              - Pairing codes are protected and never logged to Logcat.
            - **Google Sign-In & Offline Guest Parent Support**:
              - Android Credential Manager integration properly separates Google subject ID from email.
              - Dedicated offline guest parent profile support for 100% internet-free deployments.
            - **Hardened Background Safety Monitoring**:
              - Android 14+ `connectedDevice|location` foreground service with screen wake lock and full-screen intents.
              - Boot restoration using `goAsync()`.
              - Zero duplicate alerts from repeated BLE advertisements.

            ---
            ### 📱 Download & Verification:
            - Download the release APK and verify SHA-256 checksum against `SHA256SUMS.txt`.
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
