name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBand-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=SafeBand $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.1" >> $GITHUB_OUTPUT
            echo "title=SafeBand v1.0.1 - Parent Alert Bugfix" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🛡️ SafeBand (ChildGuard) Release - ${{ steps.release_info.outputs.tag }}

            ### 🚀 Highlights & Bug Fixes:
            - **Parent Alert Continuous Sound Bug Fixed**: 
              - Fixed an issue where the parent alarm kept ringing and re-triggering repeatedly even after tapping dismiss or silence.
              - Added incident acknowledgment state (`_isParentAlertSilenced`) so repeated incoming BLE packets from an active incident update coordinates in the background without restarting the siren.
            - **Active Child Cancellation Broadcast**:
              - When child cancels SOS or safe-zone departure, child broadcasts a brief `NORMAL` beacon.
              - Parent device instantly receives this and clears the siren and alert dialog automatically.
            - **Watchdog Timeout**:
              - Added a 7-second watchdog timer in Parent mode to automatically shut off the alert if the child device goes out of range or stops broadcasting.
            - **Parent Monitor Banner**:
              - Added a "Siren silenced • Beacon active" banner with a "View Details" button on the Parent Monitor tab.

            ---
            ### 📱 Download & Install:
            - Download **`app-debug.apk`** below directly to your Android device.
            - Open the APK and allow installation to update or install SafeBand.
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
