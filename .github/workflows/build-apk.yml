name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBand-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=SafeBand $TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.3" >> $GITHUB_OUTPUT
            echo "title=SafeBand v1.0.3 - Real Maps, Physical Addresses & Alerting Child Sync" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🛡️ SafeBand (ChildGuard) Release - ${{ steps.release_info.outputs.tag }}

            ### 🚀 New Features & Enhancements:
            - **Alerting Child's Profile Sent to Nearby Parent Node**:
              - The emergency alert sheet on the receiving Parent device now displays the **child's details who issued the alert** (name, age, blood group badge, primary parent phone, medical conditions, allergies), NEVER the parent device's own child data.
              - Multi-packet BLE broadcast protocol continuously transmits the alerting child's identity, parent contact, medical conditions, and emergency contacts peer-to-peer offline.
            - **Full Physical Address Reverse Geocoding**:
              - Automatically resolves and displays detailed physical addresses (**Street, Area/Locality, City, State, and PIN code**) alongside exact GPS coordinates in the emergency alert sheet, safe zone banner, and incident history.
              - Pre-composed emergency dispatch SMS now includes full physical address and a direct Google Maps navigation link.
            - **Interactive Real Street Map in Safe Zone (OpenStreetMap / Leaflet)**:
              - Replaced radar canvas rings with a real interactive street map powered by Leaflet and OpenStreetMap.
              - Shows real-world streets, roads, residential areas, safe zone circular geofence boundary, safe zone center pin, live child location pin, street/satellite layer toggle, and 1-tap map repositioning.
            - **Indian Emergency Services (112 & 1098)**:
              - Pre-seeded **National Emergency & Police (`112`)** and **Childline India (`1098`)** into emergency contacts.
              - Added dedicated 1-tap call action buttons for Police (112) and Childline (1098) directly inside the emergency alert screen.

            ---
            ### 📱 Download & Install:
            - Download **`app-debug.apk`** below directly to your Android device.
            - Open the APK and allow installation to update or install SafeBand.
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
